name: CI

# O QUE ESTE ARQUIVO AFIRMA, E O QUE ELE NÃO AFIRMA.
#
# Ele afirma DUAS coisas: (1) o repositório ainda instala e ainda compila, nas
# duas linhas de LTS vivas; (2) o servidor compilado SOBE pelo stdio, expõe a
# mesma superfície de ferramentas gravada em `baselines/surface-stdio.json` e
# responde a três chamadas de ponta a ponta — metadados, anos disponíveis e um
# ranking que passa pelo DuckDB e pelos parquet de `tests/fixtures/sih` (cópia
# real dos cubos de 2023 e de população; `data/*.parquet` é gitignored); e
# (3) as doze ferramentas, chamadas com argumentos fixos, devolvem byte a byte
# o que está em `baselines/golden-tools.json`; e (4) a comparação de frescor
# dos cubos com o manifesto do espelho healthbr-data (`src/freshness.ts`)
# ainda distingue "em dia" de "atrás", OFFLINE, sobre um trecho versionado do
# manifesto. Isso é smoke + golden + autoteste, não uma
# suíte: não afirma que os NÚMEROS estão certos, só que o caminho inteiro
# (binário nativo do DuckDB incluído) ainda anda e que os números não se
# moveram depois de um bump. O conserto de verdade continua sendo
# `campanha:contrato-vitest`, e é projeto, não tarefa.
#
# POR QUE EXISTIR MESMO ASSIM, num repositório privado e parado. Até 31/08/2026
# o único workflow aqui era o `publish.yml`, que roda em tag: nenhum push era
# olhado por nada. Foi assim que o `engines.node` deste repositório ficou em
# `>=18` enquanto o resto do portfólio estava em 20, sem ninguém notar. Aquela
# classe de deriva hoje tem dono — o vigia de manifesto do portfolio-monitor,
# que lê os package.json de todos os repositórios toda semana. O que sobra para
# este arquivo é o piso: se a árvore parar de compilar ou de subir, alguém fica
# sabendo no push, e não meses depois, ao voltar ao repositório.
#
# O SMOKE NASCEU EM 04/09/2026, no dia em que o lock foi destravado: 72 alertas
# do Dependabot (1 critical em `tar`), todos em runtime, vinham de duas raízes —
# o subárvore do SDK (hono, ajv, fast-uri) parado no lock, e o `duckdb` 1.4.4
# (binding legado) pinando `node-gyp ^9`, que arrasta make-fetch-happen/cacache/
# tar 6/glob 7 antigos. A primeira caiu com `npm update`; a segunda foi contida
# por um dia com `overrides.node-gyp` e resolvida em 05/09 pela migração para
# `@duckdb/node-api` (PLAN-002): binário pré-compilado por plataforma, zero
# node-gyp e zero tar na árvore. O GOLDEN NASCEU nesse dia, gravado com o
# binding antigo ANTES da troca, e foi o que provou que a troca não moveu um
# número — e, de quebra, expôs que as consultas agrupadas não tinham ordem
# garantida (corrigido no funil antes de gravar). Sem gate nenhum, aqueles
# bumps seriam fé; com smoke e golden, são medidos. Foi o que permitiu ligar
# o Dependabot (.github/dependabot.yml) sem abrir PRs que ninguém tem como
# validar: cada PR dele passa por este arquivo.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # As duas linhas de LTS vivas, o mesmo par do resto do portfólio. O piso
    # declarado em `engines.node` é `>=22`; sem ninguém rodando o 22, ele
    # voltaria a ser promessa que nada exercita — que foi o defeito de origem.
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` e não `npm install`: parte do lock, como o CI de verdade parte,
      # e falha se o lock e o package.json discordarem.
      #
      # ATENÇÃO: este passo JÁ COMPILA. O package.json tem `prepare: npm run
      # build`, e o npm roda `prepare` no `npm ci` do próprio pacote — medido em
      # 31/08/2026: depois de `rm -rf node_modules dist && npm ci`, o `dist/`
      # está lá. Então uma quebra de compilação derruba o CI aqui, com o erro do
      # tsc no meio do ruído da instalação.
      - run: npm ci

      # Redundante HOJE, de propósito. `build` é `tsc` puro, e o passo acima já
      # o executou pelo `prepare` — mas a garantia deste arquivo não deve
      # depender de um hook de ciclo de vida que alguém pode remover numa
      # limpeza perfeitamente razoável. Aqui a compilação é um passo com nome
      # próprio, que falha por si e aparece sozinho no log.
      - run: npm run build

      # Sobe o dist/ pelo stdio, compara a superfície com o baseline gravado e
      # chama três ferramentas. Mudou a superfície de propósito? Regravar com
      # `npm run smoke:stdio:baseline` no MESMO commit que muda as ferramentas.
      - run: npm run smoke:stdio

      # Mesma superfície e mesmas três chamadas, pelo transporte Streamable
      # HTTP (dist/http.js, o que roda no container do PLAN-004), contra o
      # MESMO baseline: prova que trocar o transporte não muda o que o cliente
      # vê. Sobe numa porta local; sem rede (cache e sonda de frescor off).
      - run: npm run smoke:http

      # Chama as doze ferramentas com argumentos fixos e compara o resultado
      # byte a byte com `baselines/golden-tools.json`. Gravado em 05/09/2026
      # com o binding `duckdb` legado, ANTES da migração para @duckdb/node-api
      # (PLAN-002): é o que torna a troca de binding medível. Não afirma que
      # os números estão certos — afirma que não se moveram. Mudou uma
      # consulta de propósito? Regravar com `npm run golden:tools:baseline` no
      # MESMO commit, e dizer no commit por que os valores mudaram.
      - run: npm run golden:tools

      # Frescor dos cubos (sih:cubos-frescor (a), 05/09/2026): o servidor
      # sonda o manifesto do espelho na inicialização e marca a proveniência
      # quando um cubo está atrás. Smoke e golden rodam com a sonda DESLIGADA
      # (SIH_FRESHNESS_CHECK=off) — o baseline não pode depender do portal.
      # O que se testa aqui é a comparação em si, offline: sidecar da fixture
      # vs `tests/fixtures/sih/manifest-excerpt.json` deve dar `current`, e
      # uma cópia adulterada do trecho deve dar `stale` com as partições
      # certas. Se o espelho reeditar uma partição de 2023/RR, o trecho
      # regravado (`npm run freshness:excerpt`) reprova até o cubo ser
      # regenerado — é o gate certo para o rebuild do item (b).
      - run: npm run freshness:selftest

      # Delta entre sidecars (sih:cubos-frescor (b), 05/09/2026): o gate que o
      # workflow rebuild-cubes.yml aplica a um cubo REAL recém-gerado — o golden
      # não vê data/, só a fixture. Aqui só se prova, offline, que a comparação
      # reprova o que deve (partição perdida, queda > 1% sem retirada no
      # espelho, janela regredida, escopo mudado) e aprova reedição do MS.
      # As tabelas de classificação em src/data/ são cópias do contrato que o
      # produtor dos cubos (healthbr-data, pipeline sih-cubos, desde 08/09/2026)
      # publica em sih/cubos/tables/ e assina no manifesto: o SHA-256 tem de
      # bater. Offline contra um trecho versionado do manifesto (gate); ao vivo
      # contra o canal (aviso se o portal estiver fora — não é gate de rede).
      - run: npm run tables:check:offline
      - run: npm run tables:check
      # Cache local dos cubos (src/cache.ts) provado OFFLINE: servidor HTTP
      # local com manifesto e arquivos de mentira — download íntegro aceito,
      # adulterado recusado pelo SHA-256, manifesto do disco sem rede. Nunca
      # toca em data.sidneybissoli.com.
      - run: npm run cache:selftest
