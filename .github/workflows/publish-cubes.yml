# Publica (ou republica) cubos já construídos em sih/cubos/ do bucket
# healthbr-data (R2), servido em https://data.sidneybissoli.com/sih/cubos/.
#
# Para que serve: a carga inicial dos anos que já existem como release do
# GitHub (o rebuild-cubes.yml passou a publicar no R2 sozinho a partir de
# 06/09/2026, mas os anos anteriores só estavam nas releases) e qualquer
# republicação futura (mudou o manifesto, trocou o domínio, sumiu um objeto).
#
# De onde vêm os cubos: da release MAIS RECENTE que contém o ano — o sidecar
# vem do checkout (é o versionado). O `cubes-manifest.mjs --verify` confere
# cada cubo contra o sidecar antes de subir; se a release estiver atrás do
# sidecar, falha em vez de publicar coisa velha.
name: Publish cubes

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Anos (separados por vírgula) ou 'all' (todos com sidecar em data/)"
        required: true
        default: "all"

# Mesmo grupo do rebuild: os dois escrevem o manifest.json.
concurrency:
  group: rebuild-cubes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Baixar os cubos das releases
        env:
          GH_TOKEN: ${{ github.token }}
          YEARS_INPUT: ${{ github.event.inputs.years }}
        run: |
          set -euo pipefail
          if [ "$YEARS_INPUT" = "all" ]; then
            YEARS=$(ls data/sih_provenance_*.json | sed -E 's/.*sih_provenance_([0-9]{4})\.json/\1/' | sort)
          else
            YEARS=$(echo "$YEARS_INPUT" | tr ',' ' ')
          fi
          TAGS=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
                 --jq 'sort_by(.createdAt) | reverse | .[].tagName')
          for Y in $YEARS; do
            achou=""
            for TAG in $TAGS; do
              if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "sih_causas_${Y}.parquet"; then
                gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D data --clobber -p "sih_*_${Y}.parquet"
                echo "$Y <- release $TAG"
                achou=1
                break
              fi
            done
            [ -n "$achou" ] || { echo "::error::nenhuma release tem sih_causas_${Y}.parquet"; exit 1; }
          done
          echo "YEARS_CSV=$(echo $YEARS | tr ' ' ',')" >> "$GITHUB_ENV"

      - name: Publicar em sih/cubos/ (R2)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/publish-cubes.sh "$YEARS_CSV" data
