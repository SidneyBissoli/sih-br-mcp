name: Deploy do Worker e do container

# POR QUE ESTE WORKFLOW EXISTE, e a deriva que ele fecha.
#
# Até 14/09/2026 o sih era o único servidor do portfólio com release
# inteiramente manual: o `publish.yml` publicava no npm e no registro oficial a
# cada tag, e o container NUNCA era tocado. O resultado foi medido naquele dia:
# **o container servia 0.15.3 enquanto o npm estava em 0.15.4 desde 13/09** —
# duas versões atrás, em silêncio, por um dia, porque nada compara as duas
# pontas. É a mesma lição que o senado (npm 3.5.1 contra 3.5.0 hospedado), o bcb
# (1.3.5 contra 1.3.1, servindo descrições 12x menores) e o ibge já pagaram.
#
# POR QUE A TAG, E NÃO O PUSH — aqui está a diferença que impede copiar o
# arquivo do senado sem ler. Lá o repositório INTEIRO é um Worker: `wrangler
# deploy` leva segundos e sai barato a cada push em master. Aqui há um
# CONTAINER (`worker/wrangler.jsonc`, `instance_type: basic`,
# `max_instances: 1`): o deploy reconstrói uma imagem de 98 MB e troca a
# instância, e os docs deste repositório registram uma sonda travando 900 s
# depois de um deploy (docs/plan-006-causas-pre-agregada.md). Trocar o container
# a cada commit em master pagaria esse custo por mudanças que ninguém pediu para
# publicar. A tag é o evento que JÁ significa "isto é uma release", e é dela que
# o npm e o registro partem — o container passa a partir da mesma.
#
# Roda em PARALELO ao publish.yml, de propósito, e não depois dele: o container
# compila do FONTE (o Dockerfile faz o build), não do pacote npm, então não há
# dependência real entre os dois. Encadear por `workflow_run` traria um defeito
# de brinde — workflow disparado assim faz checkout do branch padrão, não da
# TAG, e deployaria o master em vez da versão marcada.
#
# `workflow_dispatch` existe para redeploy sem release nova (trocar segredo,
# recuperar de um deploy ruim).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Sem o token, o job é PULADO em vez de falhar: workflow vermelho por
      # credencial ausente ensina a ignorar a cor, e esconde falha de verdade.
      # O deploy segue possível na mão (`npx wrangler deploy` em worker/, com
      # login local). Cadastre CLOUDFLARE_DEPLOY_TOKEN (template "Edit
      # Cloudflare Workers") e a variável CLOUDFLARE_ACCOUNT_ID para ligar.
      - name: Verificar credencial da Cloudflare
        id: cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "::warning::CLOUDFLARE_DEPLOY_TOKEN ausente — deploy pulado. Cadastre o secret para ligar o deploy contínuo."
          fi

      - if: steps.cf.outputs.ok == 'true'
        uses: actions/checkout@v7

      # NODE 22 é o piso do projeto (`engines.node` ">=22") e também o mínimo do
      # wrangler 4.x, que recusa Node < 22 e morre antes de autenticar.
      - if: steps.cf.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - if: steps.cf.outputs.ok == 'true'
        name: Instalar (raiz e worker)
        run: |
          npm ci
          npm ci --prefix worker

      # OS TESTES DO WORKER ANTES DO DEPLOY. Eles comparam a identidade entre as
      # três superfícies (SERVER_TITLE, server.json e o SERVER_CONFIG do worker)
      # e a lista de ferramentas que o worker anuncia contra a da raiz. Ficaram
      # FORA do CI até 14/09 e passaram um dia vermelhos sem ninguém ver, com o
      # conector anunciando um nome e o registro outro. Aqui eles são o portão
      # que impede publicar essa divergência.
      - if: steps.cf.outputs.ok == 'true'
        name: Typecheck e testes do worker
        run: |
          npm run typecheck --prefix worker
          npm test --prefix worker

      - if: steps.cf.outputs.ok == 'true'
        name: Deploy via Wrangler
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # A GUARDA QUE O DIA 14/09 MOSTROU SER INDISPENSÁVEL. Um smoke passaria
      # IGUAL servindo a versão anterior — foi exatamente o que aconteceu ao
      # conferir o deploy à mão: a sonda respondeu com dados corretos e citação
      # `v0.15.3`, a versão VELHA, porque a instância antiga ainda drenava.
      # Comparar o que /status reporta com o package.json é o que distingue
      # "respondeu" de "respondeu a versão nova".
      #
      # A espera é generosa porque a troca de instância do container não é
      # instantânea, e tentar de novo é mais barato que um falso negativo.
      - if: steps.cf.outputs.ok == 'true'
        name: Versão hospedada bate com o package.json
        run: |
          ESPERADA=$(node -p "require('./package.json').version")
          for i in $(seq 1 12); do
            NO_AR=$(curl -sS --max-time 30 https://sih.sidneybissoli.com/status 2>/dev/null \
              | node -p "try { JSON.parse(require('fs').readFileSync(0,'utf8')).version } catch (e) { '' }")
            echo "tentativa $i: package.json=$ESPERADA  hospedado=${NO_AR:-(sem resposta)}"
            if [ "$ESPERADA" = "$NO_AR" ]; then
              echo "o endpoint serve a versão desta tag"
              exit 0
            fi
            sleep 20
          done
          echo "::error::deriva: depois de 4 min o endpoint ainda não serve $ESPERADA"
          exit 1
